name: Self Test

on:
  pull_request:
    branches:
      - master

jobs:
  run_tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device-mapper-tests
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cryptsetup xfs xfsprogs
          version: "1.0"

      - name: Check cryptsetup enabled
        run: cryptsetup benchmark -c aes-xts-plain64 -s 512

      - name: Test
        working-directory: device-mapper-tests
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: make test
